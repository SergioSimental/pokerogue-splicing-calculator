name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check that dist/ is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ does not match src/. Run 'npm run build' and commit the result."
            git status --porcelain dist
            exit 1
          fi
